services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: run_coach
      POSTGRES_PASSWORD: run_coach
      POSTGRES_DB: run_coach
    ports:
      # 绑定隔离回环地址，避免占用本机已有 PostgreSQL 的 localhost:5433。
      - "127.0.0.2:5433:5432"
    volumes:
      - run_coach_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U run_coach -d run_coach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  run_coach_pg:
